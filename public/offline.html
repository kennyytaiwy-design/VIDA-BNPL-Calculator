<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline – VIDA BNPL Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background-color: #F9FAFB;
      color: #0F0D35;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }

    .logo-wrap {
      margin-bottom: 40px;
    }

    .logo {
      display: block;
      height: 40px;
      width: auto;
    }

    .card {
      background: #ffffff;
      border: 1px solid #DCDBEA;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 1px 3px rgba(15, 13, 53, 0.06);
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #F5F5FF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0F0D35;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    p {
      font-size: 0.9375rem;
      line-height: 1.65;
      color: #565568;
      margin-bottom: 32px;
    }

    .try-again {
      display: block;
      width: 100%;
      padding: 14px 24px;
      background: #0F0D35;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s ease;
    }

    .try-again:hover  { background: #1a1754; }
    .try-again:active { background: #060089; }

    @media (max-width: 480px) {
      .card { padding: 32px 20px; }
      h1    { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="/logo.png" alt="VIDA mycreditprofile" class="logo" />
  </div>

  <div class="card">
    <div class="icon-wrap">
      <!-- Wi-fi off icon (inline SVG — no external dependency) -->
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
           stroke="#0F0D35" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <line x1="1"  y1="1"  x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <circle cx="12" cy="20" r="1" fill="#0F0D35" stroke="none" />
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>Please reconnect to the internet to use this calculator.</p>
    <button class="try-again" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
